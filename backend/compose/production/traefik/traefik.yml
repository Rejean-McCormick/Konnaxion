log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https

  web-secure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "boatbuilder610@gmail.com"
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web

http:
  routers:
    web-media-router:
      rule: "(Host(`konnaxion.com`) || Host(`www.konnaxion.com`)) && PathPrefix(`/media/`)"
      priority: 40
      entryPoints:
        - web-secure
      service: django-media
      tls:
        certResolver: letsencrypt

    web-django-router:
      rule: "(Host(`konnaxion.com`) || Host(`www.konnaxion.com`)) && (PathPrefix(`/api/`) || PathPrefix(`/admin/`) || PathPrefix(`/accounts/`) || PathPrefix(`/users/`) || PathPrefix(`/static/`))"
      priority: 30
      entryPoints:
        - web-secure
      service: django
      tls:
        certResolver: letsencrypt

    web-frontend-router:
      rule: "Host(`konnaxion.com`) || Host(`www.konnaxion.com`)"
      priority: 10
      entryPoints:
        - web-secure
      service: frontend
      tls:
        certResolver: letsencrypt

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

    frontend:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:3000

providers:
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
