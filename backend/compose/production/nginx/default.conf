server {
  listen       80;
  server_name  localhost;

  # Never serve browser-active uploads from the trusted Konnaxion origin.
  location ~* ^/media/.*\.(?:html?|xhtml|svg|xml|js|mjs|hta|wasm)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'" always;
    return 403;
  }

  location /media/ {
    alias /usr/share/nginx/media/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
  }
}
