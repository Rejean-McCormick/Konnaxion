name: Konnaxion Deep Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konnaxion-deep-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.20.0"

  KONNAXION_WORLDS_REF: "ab2bea2a915a529c30fd69fb45386e1842861836"
  KONNAXION_CAPSULE_MANAGER_REF: "790fb20ba041cf9ed7ed31f10be96ee2284c43a7"
  KONNAXION_DIAG_REF: "97510540c14d69f7aedbb7e9c18eff3ce083250a"

  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konnaxion
  REDIS_URL: redis://127.0.0.1:6379/0
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-ephemeral-only-not-a-production-secret
  USE_DOCKER: "no"
  COMMON_OIDC_ENABLED: "false"

  NEXT_PUBLIC_API_BASE: /api
  API_PROXY_BASE: http://127.0.0.1:8000/api
  BACKEND_BASE_URL: http://127.0.0.1:8000
  SMOKE_BASE_URL: http://127.0.0.1:3000

  ETHIKOS_TEST_USERNAME: ethikos_seed_user
  ETHIKOS_TEST_EMAIL: ethikos-seed-user@example.com
  ETHIKOS_TEST_PASSWORD: test-password
  CI: "1"

jobs:
  full-local:
    name: KDiag full-local
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konnaxion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d konnaxion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout Konnaxion event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Konnaxion
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Konnaxion Worlds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Rejean-McCormick/Konnaxion_Worlds
          ref: ${{ env.KONNAXION_WORLDS_REF }}
          path: Konnaxion_Worlds
          persist-credentials: false

      - name: Checkout pinned Capsule Manager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Rejean-McCormick/Konnaxion_Capsule_Manager
          ref: ${{ env.KONNAXION_CAPSULE_MANAGER_REF }}
          path: Konnaxion_Capsule_Manager
          persist-credentials: false

      - name: Checkout pinned KonnaxionDiag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Rejean-McCormick/KonnaxionDiag
          ref: ${{ env.KONNAXION_DIAG_REF }}
          path: KonnaxionDiag
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install Python stacks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Konnaxion/backend/requirements/local.txt
          python -m pip install -e Konnaxion_Worlds/backend
          python -m pip install -e "Konnaxion_Capsule_Manager[dev]"
          python -m pip install -e "KonnaxionDiag[test,signing]"

      - name: Test KonnaxionDiag before trusting it
        run: python -m pytest KonnaxionDiag/tests -q

      - name: Install frontend dependencies from lockfile
        working-directory: Konnaxion/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: Konnaxion/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify pinned Worlds source tree
        run: python Konnaxion/scripts/check_worlds_dependency.py Konnaxion_Worlds

      - name: Prepare clean runtime database
        working-directory: Konnaxion/backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_ethikos_workflow

      - name: Record exact component revisions
        run: |
          mkdir -p ci-metadata
          {
            echo "Konnaxion=$(git -C Konnaxion rev-parse HEAD)"
            echo "Konnaxion_Worlds=$(git -C Konnaxion_Worlds rev-parse HEAD)"
            echo "Konnaxion_Capsule_Manager=$(git -C Konnaxion_Capsule_Manager rev-parse HEAD)"
            echo "KonnaxionDiag=$(git -C KonnaxionDiag rev-parse HEAD)"
            echo "runner=${{ runner.os }}/${{ runner.arch }}"
            python --version
            node --version
            pnpm --version
          } | tee ci-metadata/components.txt

      - name: Run KonnaxionDiag full-local campaign
        run: >-
          python KonnaxionDiag/kdiag.py run full-local
          --target "$GITHUB_WORKSPACE/Konnaxion"

      - name: Upload full-local evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kdiag-full-local-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            Konnaxion/.konnaxiondiag/current/
            Konnaxion/frontend/artifacts/
            ci-metadata/components.txt
