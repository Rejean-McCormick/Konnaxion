name: Konnaxion CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "cinematic/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "cinematic/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konnaxion-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.20.0"
  KONNAXION_WORLDS_REF: "ab2bea2a915a529c30fd69fb45386e1842861836"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konnaxion
  REDIS_URL: redis://127.0.0.1:6379/0
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-ephemeral-only-not-a-production-secret
  USE_DOCKER: "no"
  COMMON_OIDC_ENABLED: "false"
  NEXT_PUBLIC_API_BASE: /api
  API_PROXY_BASE: http://127.0.0.1:8000/api
  BACKEND_BASE_URL: http://127.0.0.1:8000
  SMOKE_BASE_URL: http://127.0.0.1:3000
  CI: "1"

jobs:
  backend:
    name: Backend fast
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konnaxion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d konnaxion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout Konnaxion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned Konnaxion Worlds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Rejean-McCormick/Konnaxion-Worlds
          ref: ${{ env.KONNAXION_WORLDS_REF }}
          path: Konnaxion_Worlds
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/local.txt
          python -m pip install -e ../Konnaxion_Worlds/backend

      - name: Verify pinned Worlds source tree
        run: python scripts/check_worlds_dependency.py Konnaxion_Worlds

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q --maxfail=1

  frontend:
    name: Frontend fast
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Konnaxion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Unit tests
        working-directory: frontend
        run: pnpm test --runInBand

      - name: Production build
        working-directory: frontend
        run: pnpm build
