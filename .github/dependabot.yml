version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-python:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-js:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /backend/compose/local/django
      - /backend/compose/local/docs
      - /backend/compose/production/django
      - /backend/compose/production/postgres
      - /backend/compose/production/traefik
      - /backend/compose/production/nginx
    schedule:
      interval: weekly
