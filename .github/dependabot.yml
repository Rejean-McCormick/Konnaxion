version: 2

# Deliberately quiet for a solo, AI-assisted development loop.
# Version updates stay small; no auto-merge is configured.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directories:
      - /backend/compose/local/django
      - /backend/compose/local/docs
      - /backend/compose/production/django
      - /backend/compose/production/postgres
      - /backend/compose/production/traefik
      - /backend/compose/production/nginx
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
