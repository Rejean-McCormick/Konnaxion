contract: unesco-konnaxion-world-design/source-v1
version: 1.4.0
universe: unesco
principles:
- Worlds are runtime/data isolation boundaries.
- UNESCO Commons is a directory/navigation/publication hub, never a shared business-data schema.
- ethiKos Topics are the current canonical deliberation objects; no parallel Situation DB model is introduced.
- Initial debates seed no stances, arguments, votes, or weighted outcomes.
- EkoH taxonomy remains Konnaxion-owned ISCED-F; UNESCO seeds only contextual topic relevance.
- Actor logical identity is actor.key; runtime identity is WorldPersona plus a release-local bridge User.
- Named real-person reconstructions are registry-visible but not activated in mission Worlds by default.
- Member States and National Commissions are registry-visible but materialized only by scenarios that need them.
- ethiKos write permission is projection-time state, not Actor identity or EkoH merit.
- keenKonnect and KonnectED remain existing World-owned apps; no parallel bridge schema is introduced.
- Kreative is intentionally outside this UNESCO workflow seed.
- Flagship evidence is a neutral common briefing layer, not a pre-seeded EthikosArgument.
- Flagship casting activates organizations/stakeholder proxies; named real-person reconstructions remain opt-in.
- Cross-World flagship links use canonical WorldRelation references edges and never grant data access.
