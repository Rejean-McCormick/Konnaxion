flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_info_platform_governance
world: unesco-information-digital
topic_key: expression_platform_harms
i18n:
  fr:
    title: 'Gouvernance des plateformes : réduire les préjudices sans étouffer l’expression'
    question: Comment réduire les risques systémiques et les contenus préjudiciables sur les plateformes tout en protégeant
      liberté d’expression, accès à l’information et garanties procédurales ?
  en:
    title: 'Platform governance: reducing harms without suppressing expression'
    question: How should platforms address systemic risks and harmful content while protecting freedom of expression, access
      to information and due process?
context: UNESCO’s Internet for Trust approach frames platform governance as human-rights-based, multistakeholder, transparent
  and accountable, with attention to systemic risks rather than only individual content removal.
trigger: A fictional regulator and major platforms must agree on a governance framework after evidence of harmful amplification
  and inconsistent moderation practices.
decision_task: Define due-diligence duties, transparency, risk assessment, user redress, regulator independence, research
  access and emergency safeguards.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Measuring systemic harm
- Algorithmic opacity
- Cross-border legal differences
- Fast-changing platform design
tensions:
- Safety vs expression
- Transparency vs security/privacy
- Regulatory power vs independence
- Global consistency vs local context
casting:
  core_actor_keys:
  - unesco_ci_sector
  - itu
  - wikimedia_foundation
  - stakeholder_journalists
  - stakeholder_civil_society
  - stakeholder_private_sector
  - stakeholder_youth
  - stakeholder_researchers
  optional_actor_keys:
  - ohchr
  - stakeholder_local_communities
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- internet_for_trust
- digital_platform_guidelines
- world_trends_2025
- ai_ethics_recommendation
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: design_change
  description: A platform introduces a major recommender-system change.
- key: crisis_event
  description: An emergency creates pressure for rapid restrictions before normal review can operate.
- key: research_access
  description: Independent researchers request platform data to evaluate systemic risk.
cross_world_links:
- target_world: unesco-humanity-society
  relation: references
  reason: human rights, AI ethics and social impacts
- target_world: unesco-education
  relation: references
  reason: media/information literacy and youth
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Implement a platform-governance compliance/transparency programme with risk assessments and redress.
  konnected_case:
    enabled: true
    role_replay:
    - platform regulator
    - platform operator
    - journalist
    - civil-rights advocate
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
