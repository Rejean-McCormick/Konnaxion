flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_ocean_coastal_resilience
world: unesco-ocean
topic_key: coastal_resilience_planning
i18n:
  fr:
    title: 'Résilience côtière : protéger, adapter ou relocaliser'
    question: Comment répartir les investissements entre protection, adaptation et relocalisation lorsque les risques côtiers
      augmentent et que les ressources sont limitées ?
  en:
    title: 'Coastal resilience: protect, adapt or relocate'
    question: How should investment be allocated among protection, adaptation and relocation as coastal risks increase and
      resources remain limited?
context: UNESCO-IOC work on coastal hazards emphasizes end-to-end warning, community preparedness, data integration and locally
  actionable resilience. Ocean planning increasingly combines science, social data and inclusive governance.
trigger: A fictional coastal region has funding for only part of its proposed resilience programme and must prioritize measures
  before the next planning cycle.
decision_task: Produce a phased resilience portfolio, decision criteria, community safeguards, early-warning priorities and
  triggers for future relocation decisions.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Sea-level/hazard uncertainty
- Unequal local vulnerability
- Asset valuation disagreement
- Changing insurance/finance conditions
tensions:
- Protect in place vs managed relocation
- Economic assets vs vulnerable communities
- Near-term protection vs long-term adaptation
- Central planning vs community agency
casting:
  core_actor_keys:
  - ioc_unesco
  - wmo
  - unesco_sciences_sector
  - stakeholder_local_communities
  - stakeholder_indigenous_peoples
  - stakeholder_civil_society
  - stakeholder_researchers
  - stakeholder_youth
  optional_actor_keys:
  - stakeholder_private_sector
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- ocean_tsunami_capacity_2025
- ocean_cord_2026
- ocean_sopm_2025
- ioc_exec_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: hazard_update
  description: New modelling increases projected exposure for one densely populated area.
- key: community_refusal
  description: A community rejects relocation and proposes a locally designed adaptation package.
- key: funding_offer
  description: External finance becomes available only for measures with regional co-benefits.
cross_world_links:
- target_world: unesco-science-planet
  relation: references
  reason: environmental evidence and monitoring
- target_world: unesco-humanity-society
  relation: references
  reason: equity, participation and displacement impacts
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Create a phased coastal-resilience implementation project with indicators and review triggers.
  konnected_case:
    enabled: true
    role_replay:
    - coastal resident
    - hazard scientist
    - planner
    - local authority
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
