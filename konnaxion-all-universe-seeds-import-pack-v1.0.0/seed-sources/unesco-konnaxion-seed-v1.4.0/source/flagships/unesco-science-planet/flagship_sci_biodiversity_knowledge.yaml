flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_sci_biodiversity_knowledge
world: unesco-science-planet
topic_key: biodiversity_evidence_thresholds
i18n:
  fr:
    title: Décider avec des connaissances incomplètes sur la biodiversité
    question: Quel niveau de preuve devrait déclencher l’action lorsque les risques pour la biodiversité sont plausibles mais
      les données restent incomplètes ?
  en:
    title: Decision-making with incomplete biodiversity knowledge
    question: What evidence threshold should trigger action when biodiversity risks are plausible but data remain incomplete?
context: UNESCO notes persistent biodiversity data gaps, unequal science capacity and the importance of combining scientific,
  Indigenous and local knowledge without collapsing their different methods and governance conditions.
trigger: A fictional regional authority must decide whether to restrict a high-impact activity while monitoring data are incomplete
  and local knowledge indicates ecosystem change.
decision_task: Define an evidence threshold, precaution conditions, monitoring plan, knowledge-governance safeguards and criteria
  for revising the decision.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Sparse monitoring
- Model uncertainty
- Unequal access to technical expertise
- Different knowledge systems and consent conditions
tensions:
- Precaution vs opportunity cost
- Scientific standardization vs epistemic plurality
- Urgency vs additional research
- Open data vs community control
casting:
  core_actor_keys:
  - unesco_sciences_sector
  - iucn
  - unep
  - fao
  - stakeholder_researchers
  - stakeholder_indigenous_peoples
  - stakeholder_local_communities
  - stakeholder_civil_society
  optional_actor_keys:
  - stakeholder_private_sector
  - stakeholder_youth
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- biodiversity_knowledge_2026
- biodiversity_ilk_outlook_2025
- biodiversity_ilk_action_2025
- open_science_recommendation
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: new_local_observation
  description: Community monitoring reports a sharp change not yet visible in formal monitoring.
- key: model_revision
  description: A revised model lowers confidence but increases the plausible worst-case range.
- key: capacity_offer
  description: An external partner offers monitoring support conditional on open data.
cross_world_links:
- target_world: unesco-ocean
  relation: references
  reason: marine biodiversity and ocean data
- target_world: unesco-humanity-society
  relation: references
  reason: Indigenous participation and knowledge governance
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Launch an adaptive monitoring and governance project with explicit review thresholds and community
    participation.
  konnected_case:
    enabled: true
    role_replay:
    - environmental scientist
    - Indigenous/local knowledge holder
    - regulator
    - community representative
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
