flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_sci_open_science
world: unesco-science-planet
topic_key: open_science_access_integrity
i18n:
  fr:
    title: 'Science ouverte : accès, intégrité et équité'
    question: Comment élargir l’ouverture de la science tout en protégeant l’intégrité, la soutenabilité des infrastructures
      et l’équité entre systèmes scientifiques ?
  en:
    title: 'Open science: access, integrity and equity'
    question: How should science be opened while protecting integrity, infrastructure sustainability and equity between scientific
      systems?
context: UNESCO’s Open Science Recommendation frames openness as access to knowledge, infrastructure, societal engagement
  and dialogue with diverse knowledge systems, while emphasizing quality, equity and capacity.
trigger: A fictional consortium must design a common open-science policy for publicly funded research across institutions
  with very different infrastructure and funding capacity.
decision_task: Agree on minimum openness rules, exceptions, infrastructure responsibilities, incentives, capacity measures
  and monitoring.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Different disciplinary norms
- Unequal infrastructure capacity
- Sustainable funding uncertainty
- Legal/ethical constraints on some data
tensions:
- Openness vs legitimate restrictions
- Global standards vs local capacity
- Research incentives vs public access
- Speed vs quality/integrity
casting:
  core_actor_keys:
  - unesco_sciences_sector
  - unesco_ci_sector
  - wikimedia_foundation
  - stakeholder_researchers
  - stakeholder_indigenous_peoples
  - stakeholder_civil_society
  - stakeholder_youth
  optional_actor_keys:
  - stakeholder_private_sector
  - stakeholder_local_communities
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- open_science_recommendation
- open_science_implementation
- open_science_2025_reporting
- biodiversity_knowledge_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: repository_failure
  description: A major repository announces a funding shortfall affecting long-term preservation.
- key: sensitive_dataset
  description: A research team requests an exception for data involving sensitive community knowledge.
- key: incentive_conflict
  description: Researchers report career incentives that reward closed high-prestige publication.
cross_world_links:
- target_world: unesco-information-digital
  relation: references
  reason: digital infrastructure, access and information governance
- target_world: unesco-education
  relation: references
  reason: research training and learning capacity
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Implement an institutional open-science programme with repository governance, training and monitoring.
  konnected_case:
    enabled: true
    role_replay:
    - researcher
    - repository steward
    - community knowledge holder
    - science policymaker
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
