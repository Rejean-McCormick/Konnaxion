flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_edu_digital_inclusion
world: unesco-education
topic_key: digital_inclusion_learning
i18n:
  fr:
    title: Inclusion numérique et apprentissage
    question: Quelles obligations minimales un système éducatif devrait-il adopter pour que l’apprentissage numérique n’accroisse
      pas l’exclusion ?
  en:
    title: Digital inclusion and learning
    question: What minimum obligations should an education system adopt so digital learning does not widen exclusion?
context: Digital learning can expand access but may reproduce barriers involving devices, connectivity, language, disability,
  teacher support and household conditions. UNESCO monitoring frames technology choices through equity, relevance and sustainability.
trigger: A fictional system is expanding blended learning nationally but has a fixed budget and evidence of unequal access
  among regions and learner groups.
decision_task: Define a minimum inclusion standard, priority investments, monitoring indicators and escalation rules for inaccessible
  or ineffective digital provision.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Incomplete disability/access data
- Regional infrastructure variation
- Technology cost changes
- Different home-learning conditions
tensions:
- Universal minimum vs targeted support
- Infrastructure vs teacher/support investment
- Standardization vs local adaptation
- Access metrics vs learning outcomes
casting:
  core_actor_keys:
  - unesco_education_sector
  - unicef
  - gpe
  - world_bank
  - itu
  - stakeholder_disability
  - stakeholder_learners
  - stakeholder_teachers
  - stakeholder_local_communities
  - stakeholder_civil_society
  optional_actor_keys:
  - stakeholder_youth
  - stakeholder_indigenous_peoples
  - stakeholder_private_sector
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- edu_gem_technology_2023
- edu_disability_odl
- edu_gem_access_equity_2026
- edu_gender_strategy_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: budget_cut
  description: Implementation funding is reduced by 20% in the simulation.
- key: accessibility_audit
  description: An audit identifies major accessibility barriers in a widely used platform.
- key: connectivity_shock
  description: A rural region experiences prolonged network disruption during assessment.
cross_world_links:
- target_world: unesco-humanity-society
  relation: references
  reason: inclusion, equality and disability rights
- target_world: unesco-information-digital
  relation: references
  reason: digital access and platform accountability
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Create an inclusion remediation programme with accessibility audits, local support plans and outcome
    monitoring.
  konnected_case:
    enabled: true
    role_replay:
    - learner with access barriers
    - teacher
    - system administrator
    - inclusion advocate
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
