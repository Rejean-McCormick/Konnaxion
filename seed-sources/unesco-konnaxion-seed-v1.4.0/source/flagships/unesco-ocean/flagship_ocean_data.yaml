flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_ocean_data
world: unesco-ocean
topic_key: ocean_observation_data_sharing
i18n:
  fr:
    title: Partage international des données océaniques
    question: Comment renforcer le partage des données d’observation océanique tout en tenant compte de la capacité, de l’interopérabilité,
      des intérêts légitimes et de la confiance ?
  en:
    title: International ocean-data sharing
    question: How should ocean-observation data sharing be strengthened while accounting for capacity, interoperability, legitimate
      interests and trust?
context: IOC priorities emphasize ocean observations, interoperable data architectures, international cooperation and capacity
  development. Current Ocean Decade initiatives also focus on turning fragmented data into actionable coastal insights.
trigger: A fictional multinational observing network must adopt a data-sharing compact after partners report incompatible
  systems, unequal capacity and delays in access.
decision_task: Negotiate data access levels, interoperability requirements, attribution, capacity support, quality controls
  and emergency-access provisions.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Different technical standards
- Unequal observing capacity
- Data latency
- Long-term infrastructure funding
tensions:
- Open access vs legitimate restrictions
- Global interoperability vs local systems
- Speed vs quality control
- Contribution burden vs shared benefit
casting:
  core_actor_keys:
  - ioc_unesco
  - wmo
  - european_commission
  - unesco_sciences_sector
  - stakeholder_researchers
  - stakeholder_local_communities
  - stakeholder_indigenous_peoples
  - stakeholder_private_sector
  optional_actor_keys:
  - stakeholder_civil_society
  - stakeholder_youth
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- ioc_exec_2026
- ocean_cord_2026
- ocean_2025_landmark
- open_science_recommendation
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: sensor_gap
  description: A critical observing region loses several sensors for six months.
- key: emergency_request
  description: A coastal emergency creates demand for immediate access to normally delayed datasets.
- key: interoperability_cost
  description: A smaller partner cannot afford the proposed technical standard without support.
cross_world_links:
- target_world: unesco-science-planet
  relation: references
  reason: open science, scientific data and capacity
- target_world: unesco-information-digital
  relation: references
  reason: digital infrastructure and data governance
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Build a shared ocean-data interoperability and capacity programme.
  konnected_case:
    enabled: true
    role_replay:
    - ocean scientist
    - data steward
    - small-capacity national agency
    - coastal user
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
