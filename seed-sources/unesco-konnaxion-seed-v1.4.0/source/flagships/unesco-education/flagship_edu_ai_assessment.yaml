flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_edu_ai_assessment
world: unesco-education
topic_key: ai_assessment_governance
i18n:
  fr:
    title: Évaluation scolaire et IA générative
    question: Comment gouverner l’usage de l’IA générative dans l’évaluation des élèves sans présumer qu’elle doit être interdite
      ou généralisée ?
  en:
    title: Assessment and generative AI
    question: How should generative AI be governed in student assessment without presuming it should be banned or universally
      adopted?
context: Education systems are adapting assessment practice while generative AI changes how learners can produce, revise and
  explain work. UNESCO guidance emphasizes human-centred, age-appropriate, ethical and pedagogically validated use rather
  than treating AI as a universal solution.
trigger: A fictional education authority asks for an assessment policy before the next academic year after inconsistent school-level
  rules create uncertainty for learners and teachers.
decision_task: Produce a policy framework covering disclosure, permitted uses, teacher judgement, learner rights, data protection,
  assessment validity and review.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Rapid model change
- Uneven teacher capacity
- Limited comparable evidence across contexts
- Difficulty distinguishing assistance from substitution
tensions:
- Academic integrity vs formative support
- Consistency vs teacher autonomy
- Innovation vs privacy/safety
- Detection/enforcement vs trust
casting:
  core_actor_keys:
  - unesco_education_sector
  - unesco_ci_sector
  - unicef
  - itu
  - education_international
  - sdg4_youth_student_network
  - stakeholder_teachers
  - stakeholder_learners
  - stakeholder_youth
  - stakeholder_civil_society
  optional_actor_keys:
  - microsoft
  - global_campaign_for_education
  - stakeholder_disability
  - stakeholder_private_sector
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- edu_genai_guidance
- edu_gem_technology_2023
- ai_ethics_recommendation
- edu_ai_competency_students
- edu_ai_competency_teachers
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: model_update
  description: A major AI provider releases a stronger multimodal model during the policy process.
- key: privacy_incident
  description: A school reports learner personal information uploaded to an external AI service.
- key: teacher_capacity_gap
  description: A simulation survey reveals wide variation in teacher confidence and training.
cross_world_links:
- target_world: unesco-humanity-society
  relation: references
  reason: AI ethics, rights and accountability
- target_world: unesco-information-digital
  relation: references
  reason: data governance, platforms and information literacy
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Pilot an assessment-policy implementation project with training, guidance, review checkpoints and
    measurable indicators.
  konnected_case:
    enabled: true
    role_replay:
    - learner
    - teacher
    - education policymaker
    - AI governance advisor
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
