flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_humanity_neurotechnology
world: unesco-humanity-society
topic_key: bioethics_emerging_technology
i18n:
  fr:
    title: 'Neurotechnologies : bénéfices, autonomie et vie mentale'
    question: Comment gouverner les neurotechnologies pour permettre des usages bénéfiques tout en protégeant dignité, autonomie,
      vie mentale et équité ?
  en:
    title: 'Neurotechnology: benefit, autonomy and mental privacy'
    question: How should neurotechnology be governed to enable beneficial uses while protecting dignity, autonomy, mental
      privacy and equity?
context: UNESCO adopted a Recommendation on the Ethics of Neurotechnology in 2025. Its work highlights potential benefit alongside
  concerns involving dignity, autonomy, mental privacy, unequal access and interaction with AI.
trigger: A fictional regulator is asked to set conditions for a consumer neurotechnology that infers cognitive or affective
  states outside a clinical setting.
decision_task: Define permitted uses, consent requirements, mental-privacy safeguards, age/vulnerability protections, oversight
  and redress.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Rapid technical change
- Uncertain inference validity
- Long-term effects
- Boundary between wellness, employment, education and health contexts
tensions:
- Benefit vs mental privacy
- Consent vs power asymmetry
- Innovation vs precaution
- Personalization vs discrimination
casting:
  core_actor_keys:
  - unesco_social_human_sciences_sector
  - who
  - ohchr
  - stakeholder_researchers
  - stakeholder_disability
  - stakeholder_civil_society
  - stakeholder_private_sector
  - stakeholder_youth
  optional_actor_keys:
  - unesco_sciences_sector
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- neurotech_recommendation_2025
- neurotech_ethics
- ai_ethics_recommendation
- shs_sector_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: accuracy_claim
  description: The manufacturer announces improved inference accuracy based on a proprietary study.
- key: workplace_use
  description: A major employer proposes voluntary use for fatigue/performance monitoring.
- key: minor_use
  description: A school-affiliated programme proposes a pilot involving adolescents.
cross_world_links:
- target_world: unesco-science-planet
  relation: references
  reason: scientific validity, research and emerging technology
- target_world: unesco-information-digital
  relation: references
  reason: data governance, AI and privacy
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: Current Konnaxion ISCED-F fixture lacks detailed biomedical/neuroscience categories; Smart Vote should display
    this limitation rather than invent expertise categories.
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Create an ethical-governance programme with review, audit and redress.
  konnected_case:
    enabled: true
    role_replay:
    - regulator
    - researcher
    - rights advocate
    - technology developer
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
