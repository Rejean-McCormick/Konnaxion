flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_humanity_youth_participation
world: unesco-humanity-society
topic_key: youth_public_decisions
i18n:
  fr:
    title: De la consultation des jeunes à une influence réelle
    question: Quels mécanismes donnent aux jeunes une influence réelle dans la décision publique sans transformer la participation
      en simple consultation symbolique ?
  en:
    title: From youth consultation to meaningful influence
    question: What mechanisms give young people meaningful influence in public decision-making rather than symbolic consultation?
context: Recent UNESCO work distinguishes participation from genuine influence and provides global measurement plus institutional
  examples of youth recommendations entering formal processes.
trigger: A fictional public body is redesigning its youth participation mechanism after participants report that consultations
  rarely affect final decisions.
decision_task: Design representation rules, agenda rights, feedback/accountability mechanisms, resourcing, accessibility safeguards
  and measures of actual influence.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Representativeness of youth bodies
- Different age/legal contexts
- Unequal participation resources
- Difficulty measuring influence
tensions:
- Broad inclusion vs manageable structures
- Advisory voice vs decision power
- Speed vs deliberation
- Institutional accountability vs flexibility
casting:
  core_actor_keys:
  - unesco_social_human_sciences_sector
  - stakeholder_youth
  - sdg4_youth_student_network
  - stakeholder_civil_society
  - stakeholder_disability
  - stakeholder_indigenous_peoples
  - stakeholder_local_communities
  optional_actor_keys:
  - unesco_education_sector
  - stakeholder_learners
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- youth_report_2026
- youth_forum_2025
- youth_process_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: representation_challenge
  description: A youth coalition argues the proposed selection process excludes rural and marginalized youth.
- key: decision_deadline
  description: An urgent policy deadline shortens the consultation window.
- key: accountability_gap
  description: Participants request a binding response explaining which recommendations were accepted or rejected and why.
cross_world_links:
- target_world: unesco-education
  relation: references
  reason: youth/student participation in education decisions
- target_world: unesco-information-digital
  relation: references
  reason: digital participation and information access
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Create an ongoing youth-governance mechanism with participation funding, response obligations and
    evaluation.
  konnected_case:
    enabled: true
    role_replay:
    - youth representative
    - public official
    - civil-society facilitator
    - accessibility advocate
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
