flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_culture_digital_heritage
world: unesco-culture-heritage
topic_key: digital_cultural_collections
i18n:
  fr:
    title: Préserver et ouvrir le patrimoine documentaire numérique
    question: Quel modèle d’accès et de préservation devrait gouverner les collections patrimoniales numérisées lorsque accès
      public, droits, contexte culturel et continuité numérique entrent en tension ?
  en:
    title: Preserving and opening digital documentary heritage
    question: What preservation and access model should govern digitized heritage collections when public access, rights,
      cultural context and digital continuity are in tension?
context: UNESCO’s Memory of the World programme combines preservation and access. Its normative framework recognizes digital
  continuity, technological obsolescence, rights-holder interests and public value.
trigger: A fictional consortium of memory institutions must publish a large digitized collection while replacing an obsolete
  repository platform.
decision_task: Define preservation responsibilities, access tiers, rights/context controls, interoperability, migration policy
  and long-term stewardship.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Rights status uncertainty
- Obsolete formats
- Uneven institutional capacity
- Culturally sensitive material
tensions:
- Universal access vs legitimate restrictions
- Central repository vs distributed stewardship
- Preservation fidelity vs usability
- Open reuse vs contextual integrity
casting:
  core_actor_keys:
  - unesco_culture_sector
  - unesco_ci_sector
  - wikimedia_foundation
  - stakeholder_cultural_practitioners
  - stakeholder_indigenous_peoples
  - stakeholder_civil_society
  - stakeholder_researchers
  optional_actor_keys:
  - stakeholder_local_communities
  - stakeholder_youth
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- mow_about_2026
- mow_recommendation_2015
- mow_monitoring_2026
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: format_obsolescence
  description: A preservation audit identifies a high-risk legacy format.
- key: rights_claim
  description: A community requests restricted access to a subset planned for open publication.
- key: platform_offer
  description: A commercial platform offers free hosting in exchange for broad reuse rights.
cross_world_links:
- target_world: unesco-information-digital
  relation: references
  reason: access to information, infrastructure and platform governance
- target_world: unesco-education
  relation: references
  reason: education and reuse of documentary heritage
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Build a digital-preservation and access programme with migration, rights review and stewardship responsibilities.
  konnected_case:
    enabled: true
    role_replay:
    - archivist
    - community knowledge holder
    - digital preservation engineer
    - public-access advocate
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
