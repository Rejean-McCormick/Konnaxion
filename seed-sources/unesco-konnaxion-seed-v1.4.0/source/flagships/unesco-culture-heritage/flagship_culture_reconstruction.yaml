flagship_contract: unesco-flagship-simulation/source-v1
version: 1.4.0
key: flagship_culture_reconstruction
world: unesco-culture-heritage
topic_key: heritage_reconstruction
i18n:
  fr:
    title: Reconstruire un patrimoine endommagé
    question: Comment décider de reconstruire un patrimoine endommagé lorsque authenticité, documentation, usages communautaires
      et besoins futurs ne pointent pas tous dans la même direction ?
  en:
    title: Reconstructing damaged heritage
    question: How should damaged heritage be reconstructed when authenticity, documentation, community use and future needs
      do not all point in the same direction?
context: World Heritage practice treats authenticity, documentation, conservation and cultural context as central, while reconstruction
  debates increasingly consider community and intangible values alongside material evidence.
trigger: A fictional heritage property suffers major damage. Documentation is strong for some elements but incomplete for
  others, while the surrounding community seeks rapid restoration of use.
decision_task: Agree on what may be reconstructed, what must remain legible as loss, documentation thresholds, community participation
  and a staged conservation plan.
scope:
  baseline_date: '2026-09-29'
  geography: global / adaptable per scenario variant
uncertainties:
- Incomplete documentation
- Competing interpretations of authenticity
- Urgent community needs
- Funding and skills constraints
tensions:
- Material authenticity vs living/community value
- Rapid recovery vs conservation process
- Expert judgement vs community agency
- Reconstruction vs memorialization
casting:
  core_actor_keys:
  - unesco_culture_sector
  - unesco_world_heritage_centre
  - icomos
  - iccrom
  - stakeholder_cultural_practitioners
  - stakeholder_local_communities
  - stakeholder_indigenous_peoples
  - stakeholder_civil_society
  optional_actor_keys:
  - stakeholder_youth
  - stakeholder_private_sector
  real_person_policy: No named real person is activated by default; use sourced reconstructed personas only when explicitly
    selected.
evidence_refs:
- wh_operational_guidelines_2025
- wh_authenticity_2025
- wh_reconstruction_context
round_plan:
- round: 0
  key: briefing
  purpose: Read common evidence, scope and uncertainties; no position yet.
- round: 1
  key: opening
  purpose: Actors state initial positions and explicit objectives.
- round: 2
  key: challenge
  purpose: Cross-examination, objections and requests for evidence.
- round: 3
  key: evidence_inject
  purpose: Release one scenario inject; actors may revise positions.
- round: 4
  key: options
  purpose: Generate options and make trade-offs explicit.
- round: 5
  key: negotiation
  purpose: Coalitions, amendments and negotiated language.
- round: 6
  key: deliberation
  purpose: Final argument map and Smart Vote baseline/EkoH readings.
- round: 7
  key: outcome
  purpose: Decision/proposal, dissent, unresolved questions and follow-up.
event_injects:
- key: new_archive
  description: New archival drawings improve documentation for one damaged component.
- key: community_priority
  description: Community consultation identifies ceremonial function as more urgent than visitor access.
- key: donor_condition
  description: A major donor offers funding for visually complete reconstruction on a compressed schedule.
cross_world_links:
- target_world: unesco-humanity-society
  relation: references
  reason: community participation, identity and ethics
- target_world: unesco-science-planet
  relation: references
  reason: materials, risk and evidence
ekoh:
  relevance_source: existing topic_relevance in the World scenario
  seed_scores: false
  coverage_gap: null
outputs:
  ethikos: Outcome / proposal / dissent / unresolved questions
  keenkonnect_candidate: Create a conservation/reconstruction project with documentation gates, community governance and staged
    work packages.
  konnected_case:
    enabled: true
    role_replay:
    - heritage professional
    - community representative
    - conservation authority
    - craft practitioner
    evidence_rule: KonnectED learning evidence does not directly mutate EkoH scores.
